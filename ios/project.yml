name: Sidespeaker
options:
  bundleIdPrefix: com.sidespeaker
  deploymentTarget:
    iOS: "16.0"
targets:
  Sidespeaker:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Sidespeaker
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        SidePort: 5000
        SidePrebufferMs: 60
        SideMaxBufferMs: 200
        SideBgPrebufferMs: 300
        SideBgMaxBufferMs: 450
        SideTimeoutMs: 3000
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidespeaker.app
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
